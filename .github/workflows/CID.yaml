name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to run the workflow on (manual dispatch only)."
        required: true
        type: string
        default: main

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate Quality Gates

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Enable Corepack and activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.27.0 --activate

      - name: Install dependencies (pnpm)
        run: pnpm install --color=true

      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm type-check
      - run: pnpm check:i18n-parity
      - run: pnpm test:ci
      - run: pnpm check:pages-tests
      - run: pnpm build:webpack
      - run: pnpm perf:ci
      - run: pnpm lhci:collect
        continue-on-error: true
      - run: pnpm lhci:assert
        continue-on-error: true
